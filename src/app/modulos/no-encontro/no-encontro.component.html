<!-- Pagina 404 - se muestra cuando no se encuentra la ruta solicitada -->

<div class="d-flex flex-column align-items-center justify-content-center text-center" style="margin-top: 150px;">
  <!-- Icono de advertencia -->
  <i class="bi bi-exclamation-triangle text-brand opacity-50 mb-3" style="font-size: 4rem;"></i>
  <!-- Titulo de pagina no encontrada -->
  <h1 class="fw-bold text-dark mb-2" style="font-size: 2.5rem;">Página no encontrada</h1>
  <!-- Mensaje explicativo -->
  <p class="text-secondary mb-4" style="max-width: 400px;">Lo sentimos, la página que estás buscando no existe. Por favor, verifica la URL o regresa al panel.</p>
  <!-- Boton para volver al dashboard -->
  <a routerLink="/dashboard" class="btn btn-brand rounded-pill px-4 py-2 fw-bold shadow-sm d-inline-flex align-items-center gap-2">
    <i class="bi bi-house-fill"></i> Volver al Inicio
  </a>
</div>
